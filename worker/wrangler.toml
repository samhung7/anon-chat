# The photo service (src/index.js): a Cloudflare Worker at api.stoatalk.app in front of the R2 bucket stoatalk-photos,
# which is public at files.stoatalk.app, and the Web Push sender (src/push.js). Deployed by .github/workflows/worker.yml
# with the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; the VAPID_KEY secret (a P-256 JWK, made on
# site/admin.html) turns push on. The CLEANUP_DISPATCH_TOKEN secret (a GitHub token that may run this repository's
# workflows) lets the hourly cron below start the cleanup, which GitHub's own schedule runs only every few hours.
name = "stoatalk-photos"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [{ pattern = "api.stoatalk.app", custom_domain = true }]

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "stoatalk-photos"

[vars]
PROJECT_ID = "anon-chat-2792b"
DATABASE_URL = "https://anon-chat-2792b-default-rtdb.asia-southeast1.firebasedatabase.app"
ORIGINS = "https://stoatalk.app"
GITHUB_REPO = "samhung7/anon-chat"

[triggers]
crons = ["17 * * * *"]

# Staging (.github/workflows/staging.yml deploys it with --env staging): the same service as stoatalk-photos-staging at
# api-staging.stoatalk.app, with its own bucket (public at files-staging.stoatalk.app) and the staging Firebase project.
# PROJECT_ID and DATABASE_URL come from the STAGING_FIREBASE_* secrets at deploy time (--var), so they aren't here.
# Every pull request's preview (<branch>.stoatalk.pages.dev) and the staging branch's site may call it.
[env.staging]
triggers = { crons = [] }   # production's cron already runs the cleanup, which does staging too
routes = [{ pattern = "api-staging.stoatalk.app", custom_domain = true }]

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "stoatalk-photos-staging"

[env.staging.vars]
ORIGINS = "https://*.stoatalk.pages.dev,https://staging.stoatalk.app"

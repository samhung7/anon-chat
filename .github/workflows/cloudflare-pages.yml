# Deploys site/ to Cloudflare Pages (project "stoatalk", at stoatalk.pages.dev, and at stoatalk.app once the domain is
# connected there) on every push to main. Needs CLOUDFLARE_ACCOUNT_ID and a CLOUDFLARE_API_TOKEN that can also
# "Edit Cloudflare Pages" (besides the Workers permissions worker.yml uses); without the token it does nothing.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: tools/stamp.sh
      # the first run creates the project; after that this fails harmlessly because it exists
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages project create stoatalk --production-branch main || true
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy site --project-name stoatalk --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

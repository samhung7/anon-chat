# Deletes rooms nobody has written in for 48 hours (read-only after 24). Needs two repository secrets:
# FIREBASE_SERVICE_ACCOUNT (service account JSON) and FIREBASE_DATABASE_URL. Without them the job does nothing.
# New reports for the operator open a GitHub issue (no content, just how many).
# With CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY it also deletes photos in R2 no room points at.
# With VAPID_KEY (the secret worker.yml hands the push service too) it warns rooms' members by Web Push an hour before
# their room turns read-only and an hour before it's deleted.
name: Delete expired rooms
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write   # an issue when new reports come in, so GitHub emails the owner
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      VAPID_KEY: ${{ secrets.VAPID_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set; skipping."
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/checkout@v4
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: tools/cleanup
        run: npm ci && node cleanup.mjs

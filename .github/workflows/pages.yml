name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # tie the page to this commit's files: ?v=dev in index.html and in the modules' imports, and the service worker's cache name
      - run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html site/js/app/*.js
          if grep -rn "?v=dev" site/index.html site/js/app; then exit 1; fi
          sed -i "s/anon-chat-dev/anon-chat-${GITHUB_SHA::8}/" site/sw.js
          grep -c "?v=${GITHUB_SHA::8}" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

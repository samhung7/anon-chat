# Deploys the photo and push service (worker/) to Cloudflare when it changes on main.
# Needs the CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID secrets; without them it does nothing.
# With the VAPID_KEY secret (made on site/admin.html) it also hands the service its Web Push key, and with
# CLEANUP_DISPATCH_TOKEN (a fine-grained GitHub token for this repository with "Actions: Read and write") the token its
# cron starts the cleanup with every 15 minutes.
name: Deploy photo service
on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VAPID_KEY: ${{ secrets.VAPID_KEY }}
      CLEANUP_DISPATCH_TOKEN: ${{ secrets.CLEANUP_DISPATCH_TOKEN }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          secrets: |
            ${{ env.VAPID_KEY != '' && 'VAPID_KEY' || '' }}
            ${{ env.CLEANUP_DISPATCH_TOKEN != '' && 'CLEANUP_DISPATCH_TOKEN' || '' }}

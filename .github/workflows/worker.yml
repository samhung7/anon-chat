# Deploys the photo service (worker/) to Cloudflare when it changes on main.
# Needs the CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID secrets; without them it does nothing.
name: Deploy photo service
on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"

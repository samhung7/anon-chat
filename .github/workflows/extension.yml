# Packs extension/ (the StoaTalk side panel for Chrome) into the zip the Chrome Web Store takes, kept on the run as stoatalk-extension.
name: Pack the Chrome extension
on:
  push:
    branches: [main]
    paths: [extension/**]
  pull_request:
    paths: [extension/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r -X ../stoatalk-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: stoatalk-extension
          path: stoatalk-extension.zip

<!doctype html>
<!-- The side panel is stoatalk.app itself in a frame, not a copy of the app. Because the extension has host permission
     for stoatalk.app, Chrome gives the frame the site's own storage (not a partition of the extension's), so the panel
     is the same person as a stoatalk.app tab: same sign-in, nickname, rooms and keys. The site allows only extension
     pages to frame it (frame-ancestors in site/_headers). panel.js adds the frame once this page has shown. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoaTalk</title>
<style>
  :root { --bg: #f4efe6; --ink: #25221e; --muted: #857b6a; --btn: #6e5c44; --btn-ink: #fbfaf8; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1916; --ink: #e7decd; --muted: #b3aa9b; --btn: #d9cdb6; --btn-ink: #1b1916; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  #wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
  #wait img { width: 48px; height: 48px; }
  #wait p { margin: 0; color: var(--muted); }
  #tab { display: none; padding: 10px 18px; border-radius: 999px; background: var(--btn); color: var(--btn-ink); text-decoration: none; font-weight: 600; }
  #wait.slow #tab { display: inline-block; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="wait"><img src="icons/icon-128.png" alt=""><p id="msg"></p><a id="tab" href="https://stoatalk.app/" target="_blank" rel="noopener"></a></div>
<script src="panel.js"></script>
</body>
</html>

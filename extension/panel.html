<!doctype html>
<!-- The side panel is stoatalk.app itself in a frame, not a copy of the app. Because the extension has host permission
     for stoatalk.app, Chrome gives the frame the site's own storage (not a partition of the extension's), so the panel
     is the same person as a stoatalk.app tab: same sign-in, nickname, rooms and keys. The site allows only extension
     pages to frame it (frame-ancestors in site/_headers). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoaTalk</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { html, body { background: #1b1916; } }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe src="https://stoatalk.app/" title="StoaTalk" allow="camera; clipboard-read; clipboard-write; web-share; fullscreen"></iframe>
</body>
</html>
